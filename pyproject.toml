[project]
name = "aidevteam"
version = "0.1.0"
description = "LangGraph multi-agent team (Planner → Coder → Tester → Reviewer) that builds Python CLI apps."
requires-python = ">=3.11"
dependencies = [
    "langgraph>=1.2",
    "langchain-core>=1.6",
    "langchain-openai>=1.7",
    "pydantic>=2",
    "pydantic-settings>=2",
    "typer>=0.12",
    "rich>=13",
]

[dependency-groups]
dev = ["pytest>=8"]

[project.scripts]
aidevteam = "aidevteam.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aidevteam"]
