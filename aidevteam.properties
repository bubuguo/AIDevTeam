# aidevteam runtime properties (Java-style key=value; '#' lines are comments)
# Precedence: CLI flags > environment variables / .env > this file > defaults

# LLM sampling temperature (0.0 = deterministic, higher = more creative)
temperature=0.2

# Seconds without received data before an LLM call is aborted (read timeout,
# not a total limit — long generations are fine while tokens keep streaming)
llm_timeout=300.0

# Optional LLM context window (tokens). The context monitor logs utilisation
# as a percentage of this limit and warns when a single call exceeds it.
# Leave unset to log raw token counts only.
# llm_context_limit=128000

# Maximum coder/reviewer revision rounds in the agent pipeline
max_iterations=10

# Require manual approval of the Planner's build plan before coding starts
# (plan_approval=true). Set to false for fully automatic / non-interactive
# runs; the CLI's --plan-approval/--no-plan-approval flags override this
# per invocation.
plan_approval=true

# SQLite file backing the persistent checkpointer. The workflow state (plan,
# generated code, review verdict) is written here, so a run survives a process
# or container restart and can be continued with `aidevteam resume <run_id>`.
# A relative path resolves against the working directory — the same value
# works on the host and in the container (WORKDIR=/app).
checkpoint_db=./state/checkpoints.db

# --- Node execution (containerized pipeline) ---

# Port every node service listens on. Must stay in sync with docker-compose.yml,
# which hardcodes 8000 in each node's command / expose / healthcheck.
node_port=8000

# Seconds between job-status polls while waiting for a node to finish
node_poll_interval=120.0

# Give up if a node job runs longer than this many seconds
node_max_wait=7200.0

# Retry window (seconds) while node containers are still starting up
node_connect_grace=60.0
